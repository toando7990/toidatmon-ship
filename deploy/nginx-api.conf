# Nginx — api.toidatmon.vn → vps-worker (127.0.0.1:__WORKER_PORT__)
# bkav-proxy KHÔNG mở ra ngoài: chỉ vps-worker gọi nó qua 127.0.0.1.
# Certbot tự thêm khối listen 443 + chứng chỉ vào file này khi chạy.

limit_req_zone $binary_remote_addr zone=toidatmon_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN_API__;

    client_max_body_size 10m;   # ảnh xác nhận thanh toán, ảnh món

    location / {
        limit_req zone=toidatmon_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:__WORKER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
